name: Docker Build

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: services/employee-api
          file: services/employee-api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/api:${{ inputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ inputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build and Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: services/gateway
          file: services/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/gateway:${{ inputs.image_tag }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
