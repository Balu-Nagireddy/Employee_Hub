# =============================================================================
# Docker Build — Amazon ECR Build & Push
#
# Triggered by:
#   - Merge to main (after CI + Security pass)
#   - Manual trigger (workflow_dispatch)
#
# Builds and pushes Docker images for all services to Amazon ECR.
# Tags: latest, git SHA, semantic version (if available), branch name.
# =============================================================================

name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-semver:
        description: 'Override semantic version tag'
        required: false
        type: string

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: employee-hub
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Create ECR Repositories (if they don't exist)
  # ---------------------------------------------------------------------------
  create-ecr-repos:
    name: Create ECR Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Create ECR repositories if missing
        run: |
          for repo in employee-api frontend gateway; do
            if ! aws ecr describe-repositories --repository-names "${repo}" --region "${AWS_REGION}" > /dev/null 2>&1; then
              echo "Creating ECR repository: ${repo}"
              aws ecr create-repository \
                --repository-name "${repo}" \
                --image-scanning-configuration scanOnPush=true \
                --image-tag-mutability MUTABLE \
                --region "${AWS_REGION}" \
                --tags Key=Project,Value=${PROJECT_NAME}
            else
              echo "ECR repository already exists: ${repo}"
            fi
          done

  # ---------------------------------------------------------------------------
  # Build & Push Docker Images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [create-ecr-repos]
    timeout-minutes: 20

    strategy:
      matrix:
        service: [employee-api, frontend, gateway]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker tags
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ matrix.service }}"

          # Base tags
          TAGS="${REGISTRY}/${REPO}:${{ env.IMAGE_TAG }}"
          TAGS="${TAGS},${REGISTRY}/${REPO}:latest"
          TAGS="${TAGS},${REGISTRY}/${REPO}:${{ github.ref_name }}"

          # Try to extract semantic version from git tag
          SEMVER=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.force-semver }}" ]; then
            SEMVER="${{ inputs.force-semver }}"
          else
            # Check if current commit has a git tag matching semver
            SEMVER_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -n "${SEMVER_TAG}" ]; then
              SEMVER="${SEMVER_TAG}"
            fi
          fi
          if [ -n "${SEMVER}" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:${SEMVER}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      - name: Print workflow summary
        run: |
          echo "## Docker Build: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ matrix.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ steps.meta.outputs.registry }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | ${{ env.IMAGE_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  docker-summary:
    name: Docker Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "# Docker Build Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| employee-api | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gateway | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any build failed
        if: needs.build-and-push.result != 'success'
        run: |
          echo "❌ One or more Docker images failed to build"
          exit 1
