name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  EC2_USER: ec2-user
  STACK_DIR: /opt/employee-hub

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          cd services/employee-api
          pip install -r requirements.txt
          pip install flake8 black

      - name: Lint Python
        run: |
          cd services/employee-api
          flake8 app --max-line-length=120 --exclude=__pycache__,alembic
          black --check app --line-length=120

      - name: Run Python tests
        run: |
          cd services/employee-api
          pip install pytest
          python -m pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd services/frontend
          npm ci

      - name: Build frontend
        run: |
          cd services/frontend
          npm run build

      - name: TypeScript check
        run: |
          cd services/frontend
          npx tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security]
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service: [employee-api, frontend, gateway]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Get EC2 instance ID
        run: |
          echo "EC2_INSTANCE_ID=$(
            aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=employee-hub-app-instance" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text
          )" >> $GITHUB_ENV

      - name: Transfer config files and deploy via SSM
        run: |
          EC2_ID="${{ env.EC2_INSTANCE_ID }}"

          # ---- 1. Package all deployment config files into a tarball ----
          # Transfers the production compose file and all monitoring configs.
          tar -czf /tmp/deploy-config.tar.gz \
            deployments/docker/docker-compose.prod.yml \
            monitoring/prometheus/prometheus.yml \
            monitoring/loki/loki-config.yml \
            monitoring/promtail/promtail-config.yml \
            monitoring/grafana/datasources/datasources.yml \
            monitoring/grafana/dashboards/dashboards.yml \
            monitoring/grafana/dashboards/*.json

          B64_CONFIG=$(base64 -w0 /tmp/deploy-config.tar.gz)

          # ---- 2. Build the remote deploy script ----
          cat > /tmp/remote-deploy.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -euo pipefail

          STACK_DIR="/opt/employee-hub"
          DEPLOY_LOG="/var/log/employee-hub-deploy.log"

          exec > >(tee -a "${DEPLOY_LOG}") 2>&1

          echo "[$(date)] ====== Deployment from GitHub Actions ======"

          # Ensure directory structure exists
          mkdir -p "${STACK_DIR}/monitoring/prometheus"
          mkdir -p "${STACK_DIR}/monitoring/loki"
          mkdir -p "${STACK_DIR}/monitoring/promtail"
          mkdir -p "${STACK_DIR}/monitoring/grafana/datasources"
          mkdir -p "${STACK_DIR}/monitoring/grafana/dashboards"

          # Decode and extract deployment config
          echo "[$(date)] Extracting deployment configuration..."
          echo "CONFIG_B64_PLACEHOLDER" | base64 -d | tar -xz -C "${STACK_DIR}"

          echo "[$(date)] Config files placed at ${STACK_DIR}"

          # Verify critical files exist
          for f in "${STACK_DIR}/deployments/docker/docker-compose.prod.yml"; do
            if [ ! -f "$f" ]; then
              echo "[$(date)] ERROR: Required file $f not found after extraction!"
              ls -la "${STACK_DIR}/"
              exit 1
            fi
          done

          cd "${STACK_DIR}"

          # Export variables required by docker-compose.prod.yml
          export IMAGE_TAG="${{ github.sha }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export REGISTRY="ghcr.io"

          echo "[$(date)] Pulling latest Docker images (IMAGE_TAG=${IMAGE_TAG})..."
          docker compose -f deployments/docker/docker-compose.prod.yml pull 2>&1

          echo "[$(date)] Starting application stack..."
          docker compose -f deployments/docker/docker-compose.prod.yml up -d 2>&1

          echo "[$(date)] Checking deployment status..."
          docker compose -f deployments/docker/docker-compose.prod.yml ps 2>&1

          echo "[$(date)] ====== Remote deployment complete ======"
          SCRIPTEOF

          # Inject base64 config into the script (replace placeholder)
          sed -i "s|CONFIG_B64_PLACEHOLDER|${B64_CONFIG}|g" /tmp/remote-deploy.sh

          chmod +x /tmp/remote-deploy.sh

          # ---- 3. Send the combined script to EC2 via SSM ----
          SSM_PARAMETERS=$(jq -nc --rawfile script /tmp/remote-deploy.sh '{commands:[$script]}')

          aws ssm send-command \
            --instance-ids "${EC2_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${SSM_PARAMETERS}" \
            --comment "Deploy Employee Hub ${{ github.sha }}" \
            --output text

      - name: Wait for deployment to settle
        run: sleep 20

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Get EC2 public IP
        run: |
          echo "EC2_PUBLIC_IP=$(
            aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=employee-hub-app-instance" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text
          )" >> $GITHUB_ENV

      - name: Check KrakenD health
        run: |
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 "http://${{ env.EC2_PUBLIC_IP }}:8080/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ KrakenD Gateway is healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/12 — Gateway returned HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          echo "❌ KrakenD Gateway did not become healthy"
          exit 1

      - name: Check frontend health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 5 "http://${{ env.EC2_PUBLIC_IP }}" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend is healthy (HTTP 200)"
          else
            echo "⚠️  Frontend returned HTTP $HTTP_CODE"
          fi
