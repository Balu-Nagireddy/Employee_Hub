# =============================================================================
# Security — Comprehensive Security Scanning
#
# Triggered by:
#   - Successful completion of the CI workflow
#   - Manual trigger (workflow_dispatch)
#
# Scans:
#   - Filesystem vulnerabilities
#   - Docker images (by building them)
#   - Dependencies (Python, Node.js)
#   - Secrets (hardcoded credentials)
#   - Software licenses
#
# Generates SARIF reports and uploads them to GitHub Security tab.
# Fails on CRITICAL and HIGH severity findings.
# =============================================================================

name: Security

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [github-actions, main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: employee-hub
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  TRIVY_VERSION: 0.61.1

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Trivy — Comprehensive Security Scan
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker images so we can scan them
      - name: Build Docker images for scanning
        run: |
          docker buildx build --load \
            --tag employee-api:${{ env.IMAGE_TAG }} \
            --file services/employee-api/Dockerfile \
            services/employee-api
          docker buildx build --load \
            --tag frontend:${{ env.IMAGE_TAG }} \
            --file services/frontend/Dockerfile \
            services/frontend
          docker buildx build --load \
            --tag gateway:${{ env.IMAGE_TAG }} \
            --file services/gateway/Dockerfile \
            services/gateway

      # -----------------------------------------------------------------------
      # Filesystem Scan
      # -----------------------------------------------------------------------
      - name: Trivy — Filesystem scan
        id: trivy-fs
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Filesystem scan
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: filesystem

      # -----------------------------------------------------------------------
      # Docker Image Scan
      # -----------------------------------------------------------------------
      - name: Trivy — Docker image scan (employee-api)
        id: trivy-image-api
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          scan-ref: employee-api:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-api.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Docker image (employee-api)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-api.sarif
          category: docker-image-api

      - name: Trivy — Docker image scan (frontend)
        id: trivy-image-frontend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          scan-ref: frontend:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Docker image (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-frontend.sarif
          category: docker-image-frontend

      - name: Trivy — Docker image scan (gateway)
        id: trivy-image-gateway
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          scan-ref: gateway:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-gateway.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Docker image (gateway)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-gateway.sarif
          category: docker-image-gateway

      # -----------------------------------------------------------------------
      # Dependency Scan (Python + Node)
      # -----------------------------------------------------------------------
      - name: Trivy — Python dependency scan
        id: trivy-py-deps
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: services/employee-api
          scanners: vuln
          format: sarif
          output: trivy-py-deps.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Python dependencies
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-py-deps.sarif
          category: python-dependencies

      - name: Trivy — Node.js dependency scan
        id: trivy-node-deps
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: services/frontend
          scanners: vuln
          format: sarif
          output: trivy-node-deps.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Node.js dependencies
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-node-deps.sarif
          category: node-dependencies

      # -----------------------------------------------------------------------
      # Secret Scan
      # -----------------------------------------------------------------------
      - name: Trivy — Secret scan
        id: trivy-secrets
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Secrets
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets.sarif
          category: secrets

      # -----------------------------------------------------------------------
      # License Scan
      # -----------------------------------------------------------------------
      - name: Trivy — License scan
        id: trivy-licenses
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: sarif
          output: trivy-licenses.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF — Licenses
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-licenses.sarif
          category: licenses

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Print security scan summary
        if: always()
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Filesystem | ${{ steps.trivy-fs.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker — employee-api | ${{ steps.trivy-image-api.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker — frontend | ${{ steps.trivy-image-frontend.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker — gateway | ${{ steps.trivy-image-gateway.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Dependencies | ${{ steps.trivy-py-deps.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Dependencies | ${{ steps.trivy-node-deps.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ steps.trivy-secrets.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Licenses | ${{ steps.trivy-licenses.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Collect scan failures
        id: failures
        if: always()
        run: |
          failed=""
          for step in trivy-fs trivy-image-api trivy-image-frontend trivy-image-gateway trivy-py-deps trivy-node-deps trivy-secrets trivy-licenses; do
            outcome_var="${step}_outcome"
            # Check step outcomes
            case "${step}" in
              trivy-fs) outcome="${{ steps.trivy-fs.outcome }}" ;;
              trivy-image-api) outcome="${{ steps.trivy-image-api.outcome }}" ;;
              trivy-image-frontend) outcome="${{ steps.trivy-image-frontend.outcome }}" ;;
              trivy-image-gateway) outcome="${{ steps.trivy-image-gateway.outcome }}" ;;
              trivy-py-deps) outcome="${{ steps.trivy-py-deps.outcome }}" ;;
              trivy-node-deps) outcome="${{ steps.trivy-node-deps.outcome }}" ;;
              trivy-secrets) outcome="${{ steps.trivy-secrets.outcome }}" ;;
              trivy-licenses) outcome="${{ steps.trivy-licenses.outcome }}" ;;
            esac
            if [ "${outcome}" = "failure" ]; then
              echo "- CRITICAL/HIGH findings in ${step}" >> failure-list.txt
              failed="true"
            fi
          done
          if [ "${failed}" = "true" ]; then
            echo "❌ Security scan failed — CRITICAL or HIGH findings detected" >> $GITHUB_STEP_SUMMARY
            cat failure-list.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo "HAS_FAILURES=${failed}" >> $GITHUB_ENV

      - name: Fail on CRITICAL/HIGH findings
        if: env.HAS_FAILURES == 'true'
        run: |
          echo "❌ Security scan failed — see SARIF reports in GitHub Security tab for details"
          exit 1

      - name: Upload Trivy logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.sarif
          retention-days: 30
