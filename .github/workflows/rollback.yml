# =============================================================================
# Rollback — Automated Deployment Rollback
#
# Triggered by:
#   - Repository dispatch from deploy.yml on health check failure
#   - Manual trigger (workflow_dispatch)
#
# Redeploys the last known good image version, restarts Docker Compose,
# and verifies services. Fails the workflow if rollback itself fails.
# =============================================================================

name: Rollback

on:
  repository_dispatch:
    types: [trigger-rollback]
  workflow_dispatch:
    inputs:
      previous-tag:
        description: 'Image tag to roll back to'
        required: true
        type: string
      instance-id:
        description: 'EC2 instance ID (optional — auto-detected if omitted)'
        required: false
        type: string

concurrency:
  group: rollback-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: employee-hub
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  STACK_DIR: /opt/employee-hub
  COMPOSE_FILE: deployments/docker/docker-compose.prod.yml
  EC2_INSTANCE_TAG: employee-hub-app-instance
  REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com
  PREVIOUS_TAG: ${{ github.event.client_payload.image_tag || inputs.previous-tag }}
  INSTANCE_ID: ${{ github.event.client_payload.instance_id || inputs.instance-id || '' }}

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Rollback
  # ---------------------------------------------------------------------------
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Find EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID="${INSTANCE_ID}"
          if [ -z "${INSTANCE_ID}" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${EC2_INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "❌ No running EC2 instance found"
            exit 1
          fi
          echo "instance_id=${INSTANCE_ID}" >> $GITHUB_OUTPUT
          echo "🔍 Target EC2 instance: ${INSTANCE_ID}"

      - name: Determine rollback tag
        id: tag
        run: |
          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "Using provided previous tag: ${PREVIOUS_TAG}"
            echo "rollback_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
          else
            # Try to read previous tag from EC2
            echo "No previous tag provided — checking EC2 for stored tag..."
            PREVIOUS_TAG_FILE="${STACK_DIR}/.previous-tag"

            READ_SCRIPT=$(cat << 'SCRIPTEOF'
            #!/bin/bash
            set -euo pipefail
            PREVIOUS_TAG_FILE="/opt/employee-hub/.previous-tag"
            if [ -f "${PREVIOUS_TAG_FILE}" ]; then
              cat "${PREVIOUS_TAG_FILE}"
            else
              echo "NO_PREVIOUS_TAG"
            fi
            SCRIPTEOF
            )

            SSM_PARAMETERS=$(jq -nc --arg script "${READ_SCRIPT}" \
              '{"commands": [$script]}')

            TAG_OUTPUT=$(aws ssm send-command \
              --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
              --document-name "AWS-RunShellScript" \
              --parameters "${SSM_PARAMETERS}" \
              --comment "Read previous tag for rollback" \
              --query "Command.CommandId" \
              --output text \
              --region "${AWS_REGION}")

            sleep 10

            PREVIOUS_TAG=$(aws ssm get-command-invocation \
              --command-id "${TAG_OUTPUT}" \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --region "${AWS_REGION}" \
              --query "StandardOutputContent" \
              --output text | tr -d '[:space:]')

            if [ -z "${PREVIOUS_TAG}" ] || [ "${PREVIOUS_TAG}" = "NO_PREVIOUS_TAG" ]; then
              echo "❌ No previous tag found — cannot determine rollback version"
              exit 1
            fi
            echo "rollback_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
            echo "Auto-detected previous tag: ${PREVIOUS_TAG}"
          fi

      - name: Build rollback script
        id: script
        run: |
          ROLLBACK_TAG="${{ steps.tag.outputs.rollback_tag }}"

          cat > /tmp/remote-rollback.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -euo pipefail

          STACK_DIR="${STACK_DIR:-/opt/employee-hub}"
          COMPOSE_FILE="${COMPOSE_FILE:-deployments/docker/docker-compose.prod.yml}"
          ROLLBACK_LOG="/var/log/employee-hub-rollback.log"
          ROLLBACK_TAG="${ROLLBACK_TAG}"

          exec > >(tee -a "${ROLLBACK_LOG}") 2>&1

          echo "[$(date)] ============================================================"
          echo "[$(date)] 🔄 ROLLBACK IN PROGRESS"
          echo "[$(date)] Rolling back to image tag: ${ROLLBACK_TAG}"
          echo "[$(date)] ============================================================"

          # Export variables for docker-compose.prod.yml
          export IMAGE_TAG="${ROLLBACK_TAG}"
          export REGISTRY AWS_DEFAULT_REGION
          export DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME
          export APP_ENV="${APP_ENV:-production}"
          export APP_VERSION="${APP_VERSION:-1.0.0}"
          export LOG_LEVEL="${LOG_LEVEL:-INFO}"
          export CORS_ORIGINS="${CORS_ORIGINS:-*}"
          export GRAFANA_USER="${GRAFANA_USER:-admin}"
          export GRAFANA_PASSWORD="${GRAFANA_PASSWORD:-admin}"

          cd "${STACK_DIR}"

          # Authenticate to ECR
          echo "[$(date)] Authenticating to Amazon ECR..."
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | \
            docker login --username AWS --password-stdin "${REGISTRY}" 2>&1

          # Pull the previous images
          echo "[$(date)] Pulling previous images (tag: ${ROLLBACK_TAG})..."
          docker compose -f "${COMPOSE_FILE}" pull 2>&1

          # Restart stack with previous images
          echo "[$(date)] Restarting stack with previous images..."
          docker compose -f "${COMPOSE_FILE}" up -d --remove-orphans 2>&1

          # Show running containers
          echo "[$(date)] Running containers after rollback:"
          docker compose -f "${COMPOSE_FILE}" ps 2>&1

          echo "[$(date)] ============================================================"
          echo "[$(date)] ✅ Rollback complete — deployed tag ${ROLLBACK_TAG}"
          echo "[$(date)] ============================================================"
          SCRIPTEOF

          chmod +x /tmp/remote-rollback.sh

      - name: Execute rollback via SSM
        id: ssm
        run: |
          ROLLBACK_TAG="${{ steps.tag.outputs.rollback_tag }}"
          SCRIPT_CONTENT=$(cat /tmp/remote-rollback.sh)

          SSM_PARAMETERS=$(jq -nc \
            --arg script "${SCRIPT_CONTENT}" \
            --arg tag "${ROLLBACK_TAG}" \
            --arg registry "${REGISTRY}" \
            --arg region "${AWS_REGION}" \
            --arg stack "${STACK_DIR}" \
            --arg compose "${COMPOSE_FILE}" \
            --arg db_host "${{ secrets.DB_HOST }}" \
            --arg db_port "5432" \
            --arg db_user "${{ secrets.DB_USER }}" \
            --arg db_password "${{ secrets.DB_PASSWORD }}" \
            --arg db_name "employee_db" \
            '{
              "commands": [
                "export ROLLBACK_TAG=\($tag)",
                "export IMAGE_TAG=\($tag)",
                "export REGISTRY=\($registry)",
                "export AWS_DEFAULT_REGION=\($region)",
                "export STACK_DIR=\($stack)",
                "export COMPOSE_FILE=\($compose)",
                "export DB_HOST=\($db_host)",
                "export DB_PORT=\($db_port)",
                "export DB_USER=\($db_user)",
                "export DB_PASSWORD=\($db_password)",
                "export DB_NAME=\($db_name)",
                $script
              ],
              "workingDirectory": ["/tmp"],
              "executionTimeout": ["600"]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${SSM_PARAMETERS}" \
            --comment "Rollback Employee Hub to ${ROLLBACK_TAG}" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}")

          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Rollback command sent (CommandId: ${COMMAND_ID})"

          # Wait for completion
          sleep 30

          # Get command result
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "Status" \
            --output text)

          echo "SSM Command Status: ${STATUS}"
          echo "SSM_STATUS=${STATUS}" >> $GITHUB_ENV

          # Print output
          echo ""
          echo "=== Rollback Output ==="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" \
            --output text

          # Print errors
          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "StandardErrorContent" \
            --output text)
          if [ -n "${ERROR_OUTPUT}" ] && [ "${ERROR_OUTPUT}" != "None" ]; then
            echo ""
            echo "=== Error Output ==="
            echo "${ERROR_OUTPUT}"
          fi

      - name: Verify rollback health
        id: verify
        if: env.SSM_STATUS == 'Success'
        run: |
          HEALTH_SCRIPT=$(cat .github/scripts/health-check.sh)

          SSM_PARAMETERS=$(jq -nc \
            --arg script "${HEALTH_SCRIPT}" \
            '{"commands": [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${SSM_PARAMETERS}" \
            --comment "Rollback Health Check" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}")

          sleep 20

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "Status" \
            --output text)

          echo "Health Check Status: ${STATUS}"
          echo "ROLLBACK_HEALTH=${STATUS}" >> $GITHUB_ENV

          echo ""
          echo "=== Health Check Output ==="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" \
            --output text

      - name: Print rollback summary
        if: always()
        run: |
          echo "# Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback Tag | ${{ steps.tag.outputs.rollback_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Instance | ${{ steps.ec2.outputs.instance_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SSM Status | ${{ env.SSM_STATUS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ env.ROLLBACK_HEALTH }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if rollback failed
        if: env.SSM_STATUS != 'Success' || env.ROLLBACK_HEALTH != 'Success'
        run: |
          echo "❌ Rollback failed — manual intervention required"
          echo "  Rollback log: /var/log/employee-hub-rollback.log on EC2"
          echo "  Previous TAG: ${{ steps.tag.outputs.rollback_tag }}"
          exit 1
