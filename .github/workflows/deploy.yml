# =============================================================================
# Deploy — SSM-based deployment to EC2
#
# Triggered by:
#   - Push to main (after Docker Build completes)
#   - Workflow call from another workflow
#
# Uses AWS Systems Manager Run Command to deploy on EC2.
# No SSH keys required — SSM manages access securely via IAM.
# Automatically rolls back if health checks fail.
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ['Docker Build']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker image tag to deploy (default: latest git SHA)'
        required: false
        type: string
      skip-health-check:
        description: 'Skip health check verification'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: employee-hub
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  STACK_DIR: /opt/employee-hub
  COMPOSE_FILE: deployments/docker/docker-compose.prod.yml
  IMAGE_TAG: ${{ inputs.image-tag || github.event.workflow_run.head_sha || github.sha }}
  EC2_INSTANCE_TAG: employee-hub-app-instance
  REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Deploy via SSM Run Command
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run if the triggering workflow succeeded (or manual trigger)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Authentication
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Find EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "❌ No running EC2 instance found with tag Name=${EC2_INSTANCE_TAG}"
            exit 1
          fi
          echo "instance_id=${INSTANCE_ID}" >> $GITHUB_OUTPUT
          echo "✅ Found EC2 instance: ${INSTANCE_ID}"

      - name: Package deployment configuration
        id: package
        run: |
          # Package all config files for transfer
          tar -czf /tmp/deploy-config.tar.gz \
            deployments/docker/docker-compose.prod.yml \
            monitoring/prometheus/prometheus.yml \
            monitoring/loki/loki-config.yml \
            monitoring/promtail/promtail-config.yml \
            monitoring/grafana/datasources/datasources.yml \
            monitoring/grafana/dashboards/dashboards.yml \
            monitoring/grafana/dashboards/*.json \
            .github/scripts/deploy.sh \
            .github/scripts/health-check.sh

          B64_CONFIG=$(base64 -w0 /tmp/deploy-config.tar.gz)
          echo "config_b64=${B64_CONFIG}" >> $GITHUB_OUTPUT
          echo "✅ Deployment config packaged (${#B64_CONFIG} bytes base64)"

      - name: Build remote deploy script with embedded config
        id: script
        run: |
          CONFIG_B64="${{ steps.package.outputs.config_b64 }}"

          cat > /tmp/remote-deploy.sh << 'SCRIPTEOF'
          #!/bin/bash
          # Employee Hub — Remote Deploy via SSM
          # This script is assembled by GitHub Actions and executed on EC2.
          set -euo pipefail

          STACK_DIR="${STACK_DIR:-/opt/employee-hub}"
          COMPOSE_FILE="${COMPOSE_FILE:-deployments/docker/docker-compose.prod.yml}"
          DEPLOY_LOG="/var/log/employee-hub-deploy.log"
          PREVIOUS_TAG_FILE="${STACK_DIR}/.previous-tag"

          exec > >(tee -a "${DEPLOY_LOG}") 2>&1

          echo "[$(date)] ============================================================"
          echo "[$(date)] Employee Hub Deployment via SSM"
          echo "[$(date)] Image Tag: ${IMAGE_TAG}"
          echo "[$(date)] Stack Dir: ${STACK_DIR}"
          echo "[$(date)] ============================================================"

          # Ensure directory structure exists
          mkdir -p "${STACK_DIR}/deployments/docker"
          mkdir -p "${STACK_DIR}/monitoring/prometheus"
          mkdir -p "${STACK_DIR}/monitoring/loki"
          mkdir -p "${STACK_DIR}/monitoring/promtail"
          mkdir -p "${STACK_DIR}/monitoring/grafana/datasources"
          mkdir -p "${STACK_DIR}/monitoring/grafana/dashboards"

          # Store previous tag before overwriting
          if [ -f "${STACK_DIR}/.current-tag" ]; then
            cp "${STACK_DIR}/.current-tag" "${PREVIOUS_TAG_FILE}"
            echo "[$(date)] Saved previous tag: $(cat ${PREVIOUS_TAG_FILE})"
          fi

          # Decode and extract deployment config
          echo "[$(date)] Extracting deployment configuration..."
          echo "CONFIG_B64_PLACEHOLDER" | base64 -d | tar -xz -C "${STACK_DIR}"

          echo "[$(date)] Configuration extracted to ${STACK_DIR}"

          # Save current tag for rollback
          echo "${IMAGE_TAG}" > "${STACK_DIR}/.current-tag"

          # Export variables for docker-compose.prod.yml
          export IMAGE_TAG REGISTRY AWS_DEFAULT_REGION
          export DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME
          export APP_ENV="${APP_ENV:-production}"
          export APP_VERSION="${APP_VERSION:-1.0.0}"
          export LOG_LEVEL="${LOG_LEVEL:-INFO}"
          export CORS_ORIGINS="${CORS_ORIGINS:-*}"
          export GRAFANA_USER="${GRAFANA_USER:-admin}"
          export GRAFANA_PASSWORD="${GRAFANA_PASSWORD:-admin}"

          # Authenticate to ECR
          echo "[$(date)] Authenticating to Amazon ECR..."
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | \
            docker login --username AWS --password-stdin "${REGISTRY}" 2>&1

          cd "${STACK_DIR}"

          # Pull latest images
          echo "[$(date)] Pulling Docker images (tag: ${IMAGE_TAG})..."
          docker compose -f "${COMPOSE_FILE}" pull 2>&1

          # Restart stack
          echo "[$(date)] Restarting application stack..."
          docker compose -f "${COMPOSE_FILE}" up -d --remove-orphans 2>&1

          # Show running containers
          echo "[$(date)] Running containers:"
          docker compose -f "${COMPOSE_FILE}" ps 2>&1

          echo "[$(date)] ============================================================"
          echo "[$(date)] Remote deployment script completed"
          echo "[$(date)] ============================================================"
          SCRIPTEOF

          # Inject base64 config into the script
          sed -i "s|CONFIG_B64_PLACEHOLDER|${CONFIG_B64}|g" /tmp/remote-deploy.sh
          chmod +x /tmp/remote-deploy.sh

          echo "✅ Remote deploy script created"

      - name: Send deploy command via SSM
        id: ssm
        run: |
          SCRIPT_CONTENT=$(cat /tmp/remote-deploy.sh)

          # Build SSM parameters
          # NOTE: AWS-RunShellScript does NOT support "environmentVariables".
          # Instead, we prepend inline export commands before the main script.
          SSM_PARAMETERS=$(jq -nc \
            --arg script "${SCRIPT_CONTENT}" \
            --arg tag "${IMAGE_TAG}" \
            --arg registry "${REGISTRY}" \
            --arg region "${AWS_REGION}" \
            --arg stack "${STACK_DIR}" \
            --arg compose "${COMPOSE_FILE}" \
            --arg db_host "${{ secrets.DB_HOST }}" \
            --arg db_port "5432" \
            --arg db_user "${{ secrets.DB_USER }}" \
            --arg db_password "${{ secrets.DB_PASSWORD }}" \
            --arg db_name "employee_db" \
            '{
              "commands": [
                "export IMAGE_TAG=\($tag)",
                "export REGISTRY=\($registry)",
                "export AWS_DEFAULT_REGION=\($region)",
                "export STACK_DIR=\($stack)",
                "export COMPOSE_FILE=\($compose)",
                "export DB_HOST=\($db_host)",
                "export DB_PORT=\($db_port)",
                "export DB_USER=\($db_user)",
                "export DB_PASSWORD=\($db_password)",
                "export DB_NAME=\($db_name)",
                $script
              ],
              "workingDirectory": ["/tmp"],
              "executionTimeout": ["600"]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${SSM_PARAMETERS}" \
            --comment "Deploy Employee Hub ${{ env.IMAGE_TAG }}" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}")

          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Deploy SSM command sent (CommandId: ${COMMAND_ID})"

      - name: Wait for deployment to complete
        run: sleep 30

      - name: Verify deploy SSM command status
        id: verify-deploy
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          # Poll SSM command status
          for i in $(seq 1 6); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt ${i}/6 — Deploy SSM status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              echo "✅ Deploy command completed successfully"
              echo "deploy_status=success" >> $GITHUB_OUTPUT
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "❌ Deploy command failed (Status: ${STATUS})"
              # Print error output
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || true
              echo "deploy_status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
            sleep 10
          done

          echo "⚠️ Deploy command status unknown after polling"
          echo "deploy_status=unknown" >> $GITHUB_OUTPUT

      - name: Run health check via SSM
        id: health-check
        if: ${{ !inputs.skip-health-check }}
        run: |
          # Run health check script on EC2 via SSM
          HEALTH_SCRIPT=$(cat .github/scripts/health-check.sh)

          SSM_PARAMETERS=$(jq -nc \
            --arg script "${HEALTH_SCRIPT}" \
            '{"commands": [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${SSM_PARAMETERS}" \
            --comment "Health Check ${{ env.IMAGE_TAG }}" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}")

          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Health check sent (CommandId: ${COMMAND_ID})"

          # Wait for completion
          sleep 20

          # Get command result
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "Status" \
            --output text

          # Get the output
          echo ""
          echo "=== Health Check Output ==="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" \
            --output text

          # Check for errors
          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "StandardErrorContent" \
            --output text)

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --query "Status" \
            --output text)

          if [ "${STATUS}" != "Success" ]; then
            echo "❌ Health check failed (Status: ${STATUS})"
            echo "Error output: ${ERROR_OUTPUT}"
            echo "HEALTH_CHECK_FAILED=true" >> $GITHUB_ENV
          else
            echo "✅ Health check passed"
            echo "HEALTH_CHECK_FAILED=false" >> $GITHUB_ENV
          fi

      - name: Print deployment summary
        if: always()
        run: |
          echo "# Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ env.IMAGE_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Instance | ${{ steps.ec2.outputs.instance_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ env.HEALTH_CHECK_FAILED == 'true' && '❌ Failed' || '✅ Passed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Trigger rollback on health check failure
        if: env.HEALTH_CHECK_FAILED == 'true'
        run: |
          echo "❌ Health check failed — triggering rollback"
          echo "ROLLBACK_TRIGGERED=true" >> $GITHUB_ENV
          # Trigger rollback workflow via repository_dispatch
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"trigger-rollback","client_payload":{"image_tag":"${{ env.IMAGE_TAG }}","instance_id":"${{ steps.ec2.outputs.instance_id }}"}}'

      - name: Fail workflow on health check failure
        if: env.HEALTH_CHECK_FAILED == 'true'
        run: |
          echo "❌ Deployment failed health checks — rollback triggered"
          exit 1
