# =============================================================================
# AWS Authentication Composite Action
#
# Configures AWS credentials and sets up the AWS CLI for subsequent steps.
#
# IMPORTANT: Composite actions cannot access secrets directly.
# Callers must pass secrets as input values (e.g. AWS_ACCESS_KEY_ID).
# =============================================================================

name: 'AWS Authentication'
description: 'Configures AWS credentials for GitHub Actions'

inputs:
  aws-region:
    description: 'AWS region'
    required: false
    default: 'ap-south-1'
  aws-access-key-id:
    description: 'AWS Access Key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS Secret Access Key'
    required: true

runs:
  using: 'composite'

  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Verify AWS identity
      shell: bash
      run: |
        echo "Authenticated as: $(aws sts get-caller-identity --query Arn --output text)"
        echo "AWS Region: $(aws configure get region)"
