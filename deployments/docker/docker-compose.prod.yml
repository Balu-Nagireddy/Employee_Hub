# Production Docker Compose file.
# Uses RDS PostgreSQL from Terraform and pre-built images from Amazon ECR.
#
# Required environment variables:
#   IMAGE_TAG
#   REGISTRY (ECR registry URL: <account>.dkr.ecr.<region>.amazonaws.com)
#   DB_HOST
#   DB_PORT
#   DB_USER
#   DB_PASSWORD
#   DB_NAME
#
# Optional environment variables:
#   GRAFANA_USER
#   GRAFANA_PASSWORD

networks:
  employee-hub-network:
    name: employee-hub-network
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

services:
  employee-api:
    image: ${REGISTRY:?REGISTRY is required}/api:${IMAGE_TAG:-latest}
    container_name: employee-hub-api
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  gateway:
    image: ${REGISTRY:?REGISTRY is required}/gateway:${IMAGE_TAG:-latest}
    container_name: employee-hub-gateway
    ports:
      - "8080:8080"
      - "8090:8090"
    depends_on:
      employee-api:
        condition: service_healthy
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  frontend:
    image: ${REGISTRY:?REGISTRY is required}/frontend:${IMAGE_TAG:-latest}
    container_name: employee-hub-frontend
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: employee-hub-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_HOST:?DB_HOST is required}:${DB_PORT:-5432}/${DB_NAME:?DB_NAME is required}?sslmode=require"
    networks:
      - employee-hub-network
    restart: always

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: employee-hub-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - employee-api
      - gateway
      - postgres-exporter
    networks:
      - employee-hub-network
    restart: always

  grafana:
    image: grafana/grafana:12.0.2
    container_name: employee-hub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - employee-hub-network
    restart: always

  loki:
    image: grafana/loki:3.5.2
    container_name: employee-hub-loki

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    user: "0"

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki

    ports:
      - "3100:3100"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - employee-hub-network

    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.2
    container_name: employee-hub-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - employee-hub-network
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: employee-hub-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - employee-hub-network
    restart: always
