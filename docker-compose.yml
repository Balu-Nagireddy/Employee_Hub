version: "3.8"

networks:
  employee-hub-network:
    name: employee-hub-network
    driver: bridge

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-hub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-employee_db}
      POSTGRES_USER: ${DB_USER:-employeehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./common/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-employeehub} -d ${DB_NAME:-employee_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  employee-api:
    build:
      context: ./services/employee-api
      dockerfile: Dockerfile
    container_name: employee-hub-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-employeehub}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-employee_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: employee-hub-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://gateway:8080}
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: employee-hub-gateway
    ports:
      - "8080:8080"
      - "8090:8090"
      - "9092:9092"
      - "9093:9093"
    depends_on:
      employee-api:
        condition: service_healthy
    networks:
      - employee-hub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: employee-hub-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-employeehub}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-employee_db}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - employee-hub-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: employee-hub-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - employee-api
      - gateway
    networks:
      - employee-hub-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: employee-hub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - employee-hub-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.2
    container_name: employee-hub-loki

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    user: "0"

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki

    ports:
      - "3100:3100"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - employee-hub-network

    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.2
    container_name: employee-hub-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - employee-hub-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: employee-hub-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - employee-hub-network
    restart: unless-stopped
