server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: employee-api
    static_configs:
      - targets: []
        labels:
          job: employee-api
          service: employee-api
          __path__: /var/log/employee-api/*.log

  - job_name: gateway
    static_configs:
      - targets: []
        labels:
          job: gateway
          service: gateway
          __path__: /var/log/gateway/*.log

  - job_name: system
    static_configs:
      - targets: []
        labels:
          job: system
          service: system
          __path__: /var/log/system/*.log

  - job_name: docker
    static_configs:
      - targets: []
        labels:
          job: docker
          service: docker
          __path__: /var/lib/docker/containers/*/*.log
