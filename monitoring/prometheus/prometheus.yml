global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'employee-api'
    static_configs:
      - targets: ['employee-api:8000']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s

  - job_name: 'krakend-gateway'
    static_configs:
      - targets: ['gateway:8090']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
