global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:

  - job_name: "employee-api"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - employee-api:8000

  # Legacy KrakenD metrics
  - job_name: "krakend-legacy"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - gateway:8090

  # OpenTelemetry metrics
  - job_name: "krakend-opentelemetry"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - gateway:9092

  # OpenCensus metrics
  - job_name: "krakend-opencensus"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - gateway:9093

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090